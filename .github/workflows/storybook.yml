name: Storybook

# Builds Storybook on every pull request so a broken page fails review, and deploys
# it to GitHub Pages from main. Pages must be enabled once in the repository
# settings with "GitHub Actions" as the source.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            storybook/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build tokens
        run: npm run build:tokens

      - name: Install Storybook dependencies
        run: npm ci
        working-directory: storybook

      - name: Build Storybook
        run: npm run build-storybook
        working-directory: storybook

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: storybook/storybook-static

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
