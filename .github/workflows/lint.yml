name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json
            storybook/package-lock.json

      - name: Install root dependencies
        run: npm ci

      # Needed by the docs-site/typecheck rule (the site's own TypeScript 7 compiler).
      - name: Install docs-site dependencies
        run: npm ci
        working-directory: docs-site

      # Needed by the storybook/typecheck rule.
      - name: Install Storybook dependencies
        run: npm ci
        working-directory: storybook

      - name: Test the linter
        run: npm run test:lint

      # Findings appear as annotations on the PR diff (GitHub output format is automatic).
      - name: Lint tokens, generated output, docs and code
        run: npm run lint -- --max-warnings 0
